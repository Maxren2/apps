{% set tpl = ix_lib.base.render.Render(values) %}

{% set imap_ai_net = tpl.networks.create_internal("imap-ai-net") %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}

{# --- Postgres --- #}
{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.imap_ai.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.imap_ai.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(imap_ai_net) %}

{# --- Web (main application) --- #}
{% set web = tpl.add_container(values.consts.imap_ai_container_name, "image") %}
{% do web.set_user(values.run_as.user, values.run_as.group) %}
{% do web.add_network(imap_ai_net) %}
{# No curl/wget in the image -- a plain node http request needs nothing extra. #}
{% do web.healthcheck.set_test("node", {"port": values.network.web_port.port_number, "path": "/login"}) %}
{# The entrypoint runs `prisma migrate deploy` before serving -- first boot can take a
   little longer than a warm restart (nothing to migrate), give it real room before the
   healthcheck can mark the container unhealthy. #}
{% do web.healthcheck.set_start_period(60) %}
{% do web.healthcheck.set_retries(10) %}
{% do web.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

{% do web.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do web.environment.add_env("DATABASE_URL", postgres.get_url("postgresql")) %}
{% do web.environment.add_env("AUTH_SECRET", values.imap_ai.auth_secret) %}
{% do web.environment.add_env("CREDENTIAL_ENCRYPTION_KEY", values.imap_ai.credential_encryption_key) %}

{# Gmail/Outlook connect and Ollama-backed AI features are all optional --
   the app itself treats each as "disabled, with a clear reason" when
   unset (documented in its own README), so these are only set at all
   when the operator actually filled them in, rather than always shipping
   empty strings that would silently shadow any different value baked
   into the image. #}
{% if values.imap_ai.google_client_id %}
  {% do web.environment.add_env("GOOGLE_CLIENT_ID", values.imap_ai.google_client_id) %}
  {% do web.environment.add_env("GOOGLE_CLIENT_SECRET", values.imap_ai.google_client_secret) %}
{% endif %}
{% if values.imap_ai.microsoft_client_id %}
  {% do web.environment.add_env("MICROSOFT_CLIENT_ID", values.imap_ai.microsoft_client_id) %}
  {% do web.environment.add_env("MICROSOFT_CLIENT_SECRET", values.imap_ai.microsoft_client_secret) %}
  {% do web.environment.add_env("MICROSOFT_TENANT", values.imap_ai.microsoft_tenant) %}
{% endif %}
{% if values.imap_ai.ollama_base_url %}
  {% do web.environment.add_env("OLLAMA_BASE_URL", values.imap_ai.ollama_base_url) %}
  {% do web.environment.add_env("OLLAMA_MODEL", values.imap_ai.ollama_model) %}
{% endif %}

{% do web.environment.add_user_envs(values.imap_ai.additional_envs) %}

{% do web.add_port(values.network.web_port) %}

{% for store in values.storage.additional_storage %}
  {% do web.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"}) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do web.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
