resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

imap_ai:
  postgres_image_selector: postgres_18_image
  db_password: password
  auth_secret: test-auth-secret
  credential_encryption_key: test-credential-encryption-key
  google_client_id: ""
  google_client_secret: ""
  microsoft_client_id: ""
  microsoft_client_secret: ""
  microsoft_tenant: common
  ollama_base_url: ""
  ollama_model: ""
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 30490

ix_volumes:
  postgres_data: /opt/tests/mnt/imap-ai/postgres-data

storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []
